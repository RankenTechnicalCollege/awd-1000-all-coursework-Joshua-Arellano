<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="styles.css">
  <script src="js_hot1.js"></script>
</head>
  <body>
  <div class="p">
    <h2>Favorite Movies</h2>
    <p class="lg mt">Personal favorites</p>
    <ul id="movieList"></ul>
    <input type="text" id="movieInput" placeholder="Enter your favorite movie" class="mt">
    <button type="button" id="addMovie">Add Movie</button>
  </div>

    <div class="p">
      <h2 class="p">Age Verification</h2>
      <input type="number" id="ageInput" placeholder="Enter your age">
      <button type="button" id="verifyAge">Verify</button>
      <p id="ageMsg"></p>
    </div>

    <div>
      <h2 class="p">Enter a number (1-3)</h2>
      <input type="text" id="numberInput" placeholder="1-3">
      <button type="button" id="submitBtn">Submit</button>
      <p id="messageOutput" class="italic mt"></p>
    </div>
  </body>
</html>
