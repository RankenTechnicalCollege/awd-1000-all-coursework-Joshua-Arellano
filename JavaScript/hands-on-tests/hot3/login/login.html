<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <script src="login.js" defer></script>
</head>
<body>
  <form id="loginForm" class="container mt-5">
    <fieldset>
    <legend class="h2">Login Form</legend>

    <label for="email">Email:</label>
    <input id="email" name="email" type="email" autocomplete="email" class="form-control">
    <br>

    <label for="password">Password:</label>
    <input id="password" name="password" type="password" autocomplete="password" class="form-control">
    <br>

    <button id="submitBtn" type="submit" class="btn btn-primary">Login</button>
    </fieldset>

    <span id="message"></span>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
