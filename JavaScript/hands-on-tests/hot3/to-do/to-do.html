<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="to-do.js" defer></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <div class="container mt-5">
    <h1>To-Do List</h1>
    <ul id="taskList">
    <li>Complete JavaScript assignment</li>
    <li>Study for exam</li>
    <li>Go grocery shopping</li>
    <li>Call dentist for appointment</li>
    <li>Finish reading chapter 5</li></ul>
    <div id="taskForm">
      <input type="text" id="taskInput" placeholder="Add a new task">
      <button type="submit" id="taskAdd">Add Task</button>
      <button type="button" id="taskRemove">Remove Task</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
