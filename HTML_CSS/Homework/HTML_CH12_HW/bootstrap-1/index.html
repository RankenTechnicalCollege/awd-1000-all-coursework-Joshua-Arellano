<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
  <body>
    <div class="container my-5">
    <form id="order-form" action="/order" method="post">
      <fieldset class="mb-4">
        <legend>Contact Information</legend>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="fName" class="form-label">First Name</label>
            <input type="text" id="fName" name="fName" autocomplete="given-name" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label for="lName" class="form-label">Last Name</label>
            <input type="text" id="lName" name="lName" autocomplete="family-name" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" name="email" autocomplete="email" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label for="confirmEmail" class="form-label">Confirm Email</label>
            <input type="email" id="confirmEmail" name="confirmEmail" autocomplete="email" class="form-control" pattern required>
          </div>
        </div>
      </fieldset>

      <fieldset class="mb-4">
        <legend>Account Credentials</legend>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" autocomplete="new-password" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label for="passwordConfirm" class="form-label">Confirm Password</label>
            <input type="password" id="passwordConfirm" name="passwordConfirm" autocomplete="new-password" class="form-control" pattern required>
          </div>
        </div>
      </fieldset>

      <fieldset class="mb-4">
        <legend>Payment Information</legend>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="cardNumber" class="form-label">Card Number</label>
            <input type="text" id="cardNumber" name="cardNumber" autocomplete="cc-number" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label for="expiryDate" class="form-label">Expiration Date</label>
            <input type="text" id="expiryDate" name="expiryDate" autocomplete="cc-exp" class="form-control" required>
          </div>
          <div class="col-md-3">
            <label for="CSC" class="form-label">CSC</label>
            <input type="text" id="CSC" name="CSC" autocomplete="cc-csc" class="form-control" required>
          </div>
        </div>
      </fieldset>

      <fieldset class="mb-4">
        <legend>Billing Address</legend>
        <div class="row g-3">
          <div class="col-md-12">
            <label for="billing-street" class="form-label">Street Address</label>
            <input type="text" id="billing-street" name="billing-street" class="form-control" required>
          </div>
          <div class="col-md-12">
            <label for="billing-address2" class="form-label">Address Line 2</label>
            <input type="text" id="billing-address2" name="billing-address2" class="form-control">
          </div>

          <div class="col-md-5">
            <label for="billing-city" class="form-label">City</label>
            <input type="text" id="billing-city" name="billing-city" placeholder="City" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label for="billing-state" class="form-label">State</label>
          <select name="billing-state" id="billing-state" class="form-select" required>
            <option value="">Select State</option>
            <option value="MO">MO</option>
            <option value="IL">IL</option>
          </select>
          </div>
          <div class="col-md-3">
            <label for="billing-zip" class="form-label">Zip Code</label>
            <input type="text" id="billing-zip" name="billing-zip" placeholder="Zip Code" class="form-control" required>
          </div>
        </div>
      </fieldset>

      <fieldset class="mb-4">
        <legend>Shipping Address</legend>
        <input type="checkbox" id="same-as-billing" name="same-as-billing">Same as Billing Address
        <div class="row g-3">
          <div class="col-md-12">
            <label for="shipping-street" class="form-label">Street Address</label>
            <input type="text" id="shipping-street" name="shipping-street" class="form-control" required>
          </div>
          <div class="col-md-12">
            <label for="shipping-address2" class="form-label">Address Line 2</label>
            <input type="text" id="shipping-address2" name="shipping-address2" class="form-control">
          </div>
          <div class="col-md-5">
            <label for="shipping-city" class="form-label">City</label>
            <input type="text" id="shipping-city" name="shipping-city" placeholder="City" class="form-control" required>
          </div>
          <div class="col-md-4">
            <label for="shipping-state" class="form-label">State</label>
            <select name="shipping-state" id="shipping-state" class="form-select" required>
              <option value="" disabled selected>Select State</option>
              <option value="MO">MO</option>
              <option value="IL">IL</option>
            </select>
          </div>
          <div class="col-md-3">
            <label for="shipping-zip" class="form-label">Zip Code</label>
            <input type="text" id="shipping-zip" name="shipping-zip" placeholder="Zip Code" class="form-control" required>
          </div>
        </div>
      </fieldset>
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
